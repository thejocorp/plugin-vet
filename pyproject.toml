[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "plugin-vet"
version = "0.1.0"
description = "Static safety checks for coding-agent plugins, skills and MCP servers."
readme = "README.md"
license = "MIT"
requires-python = ">=3.9"
authors = [{ name = "thejocorp" }]
keywords = ["claude", "mcp", "ai-agents", "plugins", "skills", "supply-chain", "security", "static-analysis"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Security",
  "Topic :: Software Development :: Quality Assurance",
]
dependencies = []

[project.scripts]
plugin-vet = "plugin_vet.cli:_run"

[project.urls]
Homepage = "https://github.com/thejocorp/plugin-vet"
Issues = "https://github.com/thejocorp/plugin-vet/issues"

[tool.hatch.build.targets.wheel]
packages = ["plugin_vet"]

[tool.pytest.ini_options]
testpaths = ["tests"]
